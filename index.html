<!DOCTYPE html>
<html lang="vi">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mini Shop</title>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f6f7f9;
      color: #111827;
    }


    button,
    input,
    textarea,
    select {
      font: inherit;
    }


    button {
      cursor: pointer;
    }


    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 80px;
    }


    header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 24px;
    }


    .store-name {
      font-size: 28px;
      font-weight: 800;
    }


    .cart-badge {
      padding: 8px 14px;
      border-radius: 999px;

      background: #111827;
      color: white;

      font-size: 14px;
      font-weight: 600;
    }


    .section {
      margin-top: 32px;
    }


    .section-title {
      margin-bottom: 16px;

      font-size: 22px;
      font-weight: 800;
    }


    .products {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(240px, 1fr)
        );

      gap: 16px;
    }


    .product-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;

      overflow: hidden;
      padding-bottom: 16px;
    }


    .product-image {
      width: 100%;
      height: 220px;

      object-fit: cover;

      background: #f3f4f6;
    }


    .product-content {
      padding: 16px;
    }


    .product-name {
      font-weight: 700;
      font-size: 18px;
    }


    .product-category {
      margin-top: 4px;
      font-size: 13px;
      color: #6b7280;
    }


    .product-description {
      margin-top: 8px;

      font-size: 14px;
      line-height: 1.5;

      color: #6b7280;

      min-height: 42px;
    }


    .product-price {
      margin-top: 14px;

      font-size: 20px;
      font-weight: 800;
    }


    .product-old-price {
      margin-left: 8px;

      color: #9ca3af;
      text-decoration: line-through;

      font-size: 14px;
      font-weight: 400;
    }


    .product-stock {
      margin-top: 6px;

      font-size: 13px;
      color: #6b7280;
    }


    .product-actions {
      margin-top: 14px;

      display: flex;
      gap: 8px;
    }


    .quantity-input {
      width: 70px;

      border: 1px solid #d1d5db;
      border-radius: 8px;

      padding: 9px 8px;

      text-align: center;
    }


    .button {
      border: 0;
      border-radius: 8px;

      padding: 10px 14px;

      font-weight: 600;
    }


    .button-primary {
      background: #111827;
      color: white;
    }


    .button-secondary {
      background: #e5e7eb;
      color: #111827;
    }


    .button-danger {
      background: #fee2e2;
      color: #b91c1c;
    }


    .button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }


    .cart {
      background: white;

      border: 1px solid #e5e7eb;
      border-radius: 16px;

      overflow: hidden;
    }


    .cart-item {
      display: grid;

      grid-template-columns:
        30px
        70px
        1fr
        auto
        auto;

      gap: 12px;

      align-items: center;

      padding: 16px;

      border-bottom:
        1px solid #f0f0f0;
    }


    .cart-item:last-child {
      border-bottom: 0;
    }


    .cart-image {
      width: 70px;
      height: 70px;

      border-radius: 8px;
      object-fit: cover;

      background: #f3f4f6;
    }


    .cart-name {
      font-weight: 700;
    }


    .cart-price {
      margin-top: 4px;

      font-size: 14px;
      color: #6b7280;
    }


    .cart-quantity {
      display: flex;
      align-items: center;
      gap: 8px;
    }


    .quantity-button {
      width: 30px;
      height: 30px;

      border: 1px solid #d1d5db;
      border-radius: 6px;

      background: white;
    }


    .cart-total {
      margin-top: 16px;

      padding: 16px;

      border-top:
        1px solid #e5e7eb;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }


    .checkout {
      background: white;

      border: 1px solid #e5e7eb;
      border-radius: 16px;

      padding: 20px;
    }


    .checkout-items {
      margin-bottom: 24px;
    }


    .checkout-item {
      display: flex;
      justify-content: space-between;

      padding: 10px 0;

      border-bottom:
        1px solid #f0f0f0;
    }


    .form-grid {
      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0, 1fr)
        );

      gap: 16px;
    }


    .form-group {
      margin-bottom: 16px;
    }


    .form-group.full {
      grid-column: 1 / -1;
    }


    label {
      display: block;

      margin-bottom: 6px;

      font-weight: 600;
      font-size: 14px;
    }


    input,
    textarea,
    select {
      width: 100%;

      border:
        1px solid #d1d5db;

      border-radius: 8px;

      padding: 11px 12px;

      background: white;
    }


    textarea {
      min-height: 100px;
      resize: vertical;
    }


    .order-summary {
      margin-top: 20px;

      padding-top: 16px;

      border-top:
        1px solid #e5e7eb;
    }


    .summary-row {
      display: flex;

      justify-content: space-between;

      padding: 6px 0;
    }


    .summary-total {
      margin-top: 8px;

      padding-top: 12px;

      border-top:
        1px solid #e5e7eb;

      font-size: 20px;
      font-weight: 800;
    }


    .message {
      padding: 12px 16px;

      border-radius: 10px;

      margin-bottom: 16px;
    }


    .message-error {
      background: #fee2e2;
      color: #991b1b;
    }


    .message-success {
      background: #dcfce7;
      color: #166534;
    }


    .hidden {
      display: none !important;
    }


    .empty {
      padding: 32px;

      text-align: center;

      color: #6b7280;
    }


    @media (
      max-width: 700px
    ) {

      .form-grid {
        grid-template-columns: 1fr;
      }


      .form-group.full {
        grid-column: auto;
      }


      .cart-item {
        grid-template-columns:
          28px
          60px
          1fr;
      }


      .cart-item > .cart-quantity,
      .cart-item > .cart-line-total {
        grid-column: 3;
      }


      .cart-image {
        width: 60px;
        height: 60px;
      }

    }

  </style>

</head>


<body>

  <div class="container">

    <header>

      <div

        Mini Shop
      </div>

      <div

      </div>

    <div

    <!-- PRODUCTS -->

    <section class="section">

      <div class="section-title">
        Sản phẩm
      </div>

      <div

        class="products"
      ></div>

    </section>


    <!-- CART -->

    <section class="section">

      <div class="section-title">

      </div>

      <div class="cart">

        <div
          id="cartItems"

        >
          Giỏ hàng trống
        </div>

        <div
          id="cartFooter"
          class="cart-total hidden"
        >

          <div>

    <!-- CHECKOUT -->

        Thanh toán

      <div class="checkout">

        ></div>

              <input

              <label for="province">
                Tỉnh / Thành phố

              <input
                id="province"

              <input

          <strong id="successTotal"></strong>
        </div>

  <script>

    /* =================================================
       MARK: - Configuration
       ================================================= */

    const CONFIG = {
      API_URL:
        'https://script.google.com/macros/s/AKfycbwBmNWlCqustuCS6b_FBirEqg1pd8TmYgkA4u7yR26tn5itlFowpGi1Nk18LqvX740i/exec',

      CART_STORAGE_KEY:
        'mini-shop-cart'
    };


    /* =================================================
       MARK: - API Repository
       ================================================= */

    class ApiRepository {

      constructor(apiUrl) {
        this.apiUrl = apiUrl;
      }


      async getBootstrap() {

        const response =
          await fetch(
            `${this.apiUrl}?action=bootstrap`
          );

        return this.parseResponse(
          response
        );
      }


      async quoteOrder(
        items
      ) {

        return this.post({
          action:
            'quoteOrder',

          items
        });
      }


      async placeOrder(
        payload
      ) {

        return this.post({
          action:
            'placeOrder',

          ...payload
        });
      }


      async post(
        payload
      ) {

        /*
         Do NOT set Content-Type manually.

         We intentionally let browser send
         the request as a simple request so
         Apps Script Web App does not require
         a CORS preflight.
        */

        const response =
          await fetch(
            this.apiUrl,
            {
              method: 'POST',

              body:
                JSON.stringify(
                  payload
                )
            }
          );


        return this.parseResponse(
          response
        );
      }


      async parseResponse(
        response
      ) {

        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status}`
          );
        }


        const result =
          await response.json();


        if (!result.success) {
          throw new Error(
            result.error ||
            'Request failed'
          );
        }


        return result.data;
      }

    }


    /* =================================================
       MARK: - Cart Repository
       ================================================= */

    class LocalStorageCartRepository {

      constructor(
        storageKey
      ) {
        this.storageKey =
          storageKey;
      }


      getItems() {

        try {

          const raw =
            localStorage.getItem(
              this.storageKey
            );


          if (!raw) {
            return [];
          }


          const parsed =
            JSON.parse(raw);


          if (!Array.isArray(parsed)) {
            return [];
          }


          return parsed
            .map(item => ({
              productId:
                String(
                  item.productId
                ),

              quantity:
                Number(
                  item.quantity
                )
            }))
            .filter(
              item =>
                item.productId &&
                Number.isInteger(
                  item.quantity
                ) &&
                item.quantity > 0
            );

        } catch {
          return [];
        }
      }


      saveItems(
        items
      ) {

        localStorage.setItem(
          this.storageKey,
          JSON.stringify(items)
        );
      }


      add(
        productId,
        quantity
      ) {

        const items =
          this.getItems();


        const existing =
          items.find(
            item =>
              item.productId ===
              productId
          );


        if (existing) {

          existing.quantity +=
            quantity;

        } else {

          items.push({
            productId,
            quantity
          });

        }


        this.saveItems(items);

        return items;
      }


      updateQuantity(
        productId,
        quantity
      ) {

        const items =
          this.getItems();


        const item =
          items.find(
            item =>
              item.productId ===
              productId
          );


        if (!item) {
          return items;
        }


        if (
          quantity <= 0
        ) {

          return this.remove(
            productId
          );

        }


        item.quantity =
          quantity;


        this.saveItems(items);

        return items;
      }


      remove(
        productId
      ) {

        const items =
          this.getItems()
            .filter(
              item =>
                item.productId !==
                productId
            );


        this.saveItems(items);

        return items;
      }


      removeMany(
        productIds
      ) {

        const ids =
          new Set(productIds);


        const items =
          this.getItems()
            .filter(
              item =>
                !ids.has(
                  item.productId
                )
            );


        this.saveItems(items);

        return items;
      }

    }


    /* =================================================
       MARK: - Store
       ================================================= */

    class AppStore {

      constructor() {

        this.state = {
          loading: true,

          products: [],

          categories: [],

          settings: {},

          cart: [],

          selectedCartProductIds:
            new Set(),

          checkout: {
            mode: null,

            items: [],

            quote: null
          },

          submitting: false,

          message: null,

          successOrder: null
        };


        this.listeners = [];
      }


      subscribe(
        listener
      ) {

        this.listeners.push(
          listener
        );


        return () => {

          this.listeners =
            this.listeners.filter(
              item =>
                item !== listener
            );

        };
      }


      setState(
        patch
      ) {

        this.state = {
          ...this.state,
          ...patch
        };


        this.listeners.forEach(
          listener =>
            listener(
              this.state
            )
        );

      }


      getState() {
        return this.state;
      }

    }


    /* =================================================
       MARK: - UseCase: Load Products
       ================================================= */

    class LoadShopUseCase {

      constructor(
        apiRepository
      ) {
        this.apiRepository =
          apiRepository;
      }


      execute() {
        return this.apiRepository
          .getBootstrap();
      }

    }


    /* =================================================
       MARK: - UseCase: Add Cart
       ================================================= */

    class AddToCartUseCase {

      constructor(
        cartRepository
      ) {
        this.cartRepository =
          cartRepository;
      }


      execute(
        product,
        quantity
      ) {

        if (!product) {
          throw new Error(
            'Product not found'
          );
        }


        if (
          !Number.isInteger(
            quantity
          ) ||
          quantity <= 0
        ) {
          throw new Error(
            'Quantity must be positive'
          );
        }


        if (
          quantity >
          product.availableStock
        ) {
          throw new Error(
            `Only ${product.availableStock} available`
          );
        }


        const current =
          this.cartRepository
            .getItems()
            .find(
              item =>
                item.productId ===
                product.productId
            );


        const nextQuantity =
          current
            ? current.quantity +
              quantity
            : quantity;


        if (
          nextQuantity >
          product.availableStock
        ) {
          throw new Error(
            `Only ${product.availableStock} available`
          );
        }


        return this.cartRepository
          .add(
            product.productId,
            quantity
          );
      }

    }


    /* =================================================
       MARK: - UseCase: Update Cart Quantity
       ================================================= */

    class UpdateCartQuantityUseCase {

      constructor(
        cartRepository
      ) {
        this.cartRepository =
          cartRepository;
      }


      execute(
        product,
        quantity
      ) {

        if (!product) {
          throw new Error(
            'Product not found'
          );
        }


        const safeQuantity =
          Math.min(
            Math.max(
              1,
              quantity
            ),
            product.availableStock
          );


        return this.cartRepository
          .updateQuantity(
            product.productId,
            safeQuantity
          );
      }

    }


    /* =================================================
       MARK: - UseCase: Remove Cart Item
       ================================================= */

    class RemoveFromCartUseCase {

      constructor(
        cartRepository
      ) {
        this.cartRepository =
          cartRepository;
      }


      execute(
        productId
      ) {

        return this.cartRepository
          .remove(
            productId
          );
      }

    }


    /* =================================================
       MARK: - UseCase: Buy Now
       ================================================= */

    class BuyNowUseCase {

      execute(
        product,
        quantity
      ) {

        if (!product) {
          throw new Error(
            'Product not found'
          );
        }


        if (
          !Number.isInteger(
            quantity
          ) ||
          quantity <= 0
        ) {
          throw new Error(
            'Invalid quantity'
          );
        }


        if (
          quantity >
          product.availableStock
        ) {
          throw new Error(
            `Only ${product.availableStock} available`
          );
        }


        return [
          {
            productId:
              product.productId,

            quantity
          }
        ];
      }

    }


    /* =================================================
       MARK: - UseCase: Checkout From Cart
       ================================================= */

    class CheckoutCartUseCase {

      execute(
        cart,
        selectedProductIds
      ) {

        const selected =
          new Set(
            selectedProductIds
          );


        const items =
          cart.filter(
            item =>
              selected.has(
                item.productId
              )
          );


        if (
          items.length === 0
        ) {
          throw new Error(
            'Please select at least one product'
          );
        }


        return items.map(
          item => ({
            productId:
              item.productId,

            quantity:
              item.quantity
          })
        );
      }

    }


    /* =================================================
       MARK: - UseCase: Checkout Quote
       ================================================= */

    class GetCheckoutQuoteUseCase {

      constructor(
        apiRepository
      ) {
        this.apiRepository =
          apiRepository;
      }


      execute(
        items
      ) {

        return this.apiRepository
          .quoteOrder(
            items
          );
      }

    }


    /* =================================================
       MARK: - UseCase: Place Order
       ================================================= */

    class PlaceOrderUseCase {

      constructor(
        apiRepository
      ) {
        this.apiRepository =
          apiRepository;
      }


      execute(
        form,
        items
      ) {

        return this.apiRepository
          .placeOrder({
            customerName:
              form.customerName,

            phone:
              form.phone,

            email:
              form.email,

            address:
              form.address,

            province:
              form.province,

            district:
              form.district,

            ward:
              form.ward,

            note:
              form.note,

            paymentMethod:
              form.paymentMethod,

            shippingMethod:
              form.shippingMethod,

            items
          });
      }

    }


    /* =================================================
       MARK: - UseCase: Cart Summary
       ================================================= */

    class CartSummaryUseCase {

      execute(
        cart,
        products
      ) {

        const productMap =
          new Map(
            products.map(
              product => [
                product.productId,
                product
              ]
            )
          );


        const items =
          cart
            .map(
              cartItem => {

                const product =
                  productMap.get(
                    cartItem.productId
                  );


                if (!product) {
                  return null;
                }


                return {
                  ...cartItem,

                  product,

                  subtotal:
                    product.price *
                    cartItem.quantity
                };
              }
            )
            .filter(Boolean);


        const subtotal =
          items.reduce(
            (sum, item) =>
              sum +
              item.subtotal,
            0
          );


        return {
          items,
          subtotal
        };
      }

    }


    /* =================================================
       MARK: - Controller
       ================================================= */

    class ShopController {

      constructor(
        store,
        loadShopUseCase,
        addToCartUseCase,
        updateCartQuantityUseCase,
        removeFromCartUseCase,
        buyNowUseCase,
        checkoutCartUseCase,
        getCheckoutQuoteUseCase,
        placeOrderUseCase,
        cartRepository,
        cartSummaryUseCase
      ) {

        this.store = store;

        this.loadShopUseCase =
          loadShopUseCase;

        this.addToCartUseCase =
          addToCartUseCase;

        this.updateCartQuantityUseCase =
          updateCartQuantityUseCase;

        this.removeFromCartUseCase =
          removeFromCartUseCase;

        this.buyNowUseCase =
          buyNowUseCase;

        this.checkoutCartUseCase =
          checkoutCartUseCase;

        this.getCheckoutQuoteUseCase =
          getCheckoutQuoteUseCase;

        this.placeOrderUseCase =
          placeOrderUseCase;

        this.cartRepository =
          cartRepository;

        this.cartSummaryUseCase =
          cartSummaryUseCase;
      }


      async init() {

        try {

          const data =
            await this.loadShopUseCase
              .execute();


          const cart =
            this.cartRepository
              .getItems();


          this.store.setState({

            loading: false,

            products:
              data.products,

            categories:
              data.categories,

            settings:
              data.settings,

            cart,

            selectedCartProductIds:
              new Set(
                cart.map(
                  item =>
                    item.productId
                )
              )

          });


        } catch (error) {

          this.store.setState({

            loading: false,

            message:
              error.message

          });

        }

      }


      getProduct(
        productId
      ) {

        return this.store
          .getState()
          .products
          .find(
            product =>
              product.productId ===
              productId
          );
      }


      async addToCart(
        productId,
        quantity
      ) {

        try {

          const product =
            this.getProduct(
              productId
            );


          const cart =
            this.addToCartUseCase
              .execute(
                product,
                quantity
              );


          const state =
            this.store.getState();


          const selected =
            new Set(
              state.selectedCartProductIds
            );


          selected.add(
            productId
          );


          this.store.setState({

            cart,

            selectedCartProductIds:
              selected,

            message: null

          });


        } catch (error) {

          this.showError(
            error.message
          );

        }

      }


      async buyNow(
        productId,
        quantity
      ) {

        try {

          const product =
            this.getProduct(
              productId
            );


          const items =
            this.buyNowUseCase
              .execute(
                product,
                quantity
              );


          await this.startCheckout(
            'buyNow',
            items
          );


        } catch (error) {

          this.showError(
            error.message
          );

        }

      }


      updateCartQuantity(
        productId,
        quantity
      ) {

        try {

          const product =
            this.getProduct(
              productId
            );


          const cart =
            this.updateCartQuantityUseCase
              .execute(
                product,
                quantity
              );


          this.store.setState({
            cart
          });


          this.refreshCheckoutAfterCartChange();

        } catch (error) {

          this.showError(
            error.message
          );

        }

      }


      removeFromCart(
        productId
      ) {

        const cart =
          this.removeFromCartUseCase
            .execute(
              productId
            );


        const state =
          this.store.getState();


        const selected =
          new Set(
            state.selectedCartProductIds
          );


        selected.delete(
          productId
        );


        this.store.setState({

          cart,

          selectedCartProductIds:
            selected

        });


        this.refreshCheckoutAfterCartChange();

      }


      toggleCartSelection(
        productId,
        selected
      ) {

        const state =
          this.store.getState();


        const ids =
          new Set(
            state.selectedCartProductIds
          );


        if (selected) {
          ids.add(productId);
        } else {
          ids.delete(productId);
        }


        this.store.setState({

          selectedCartProductIds:
            ids

        });


        this.refreshCheckoutAfterCartChange();

      }


      async checkoutSelectedCart() {

        try {

          const state =
            this.store.getState();


          const items =
            this.checkoutCartUseCase
              .execute(
                state.cart,
                state.selectedCartProductIds
              );


          await this.startCheckout(
            'cart',
            items
          );


        } catch (error) {

          this.showError(
            error.message
          );

        }

      }


      async startCheckout(
        mode,
        items
      ) {

        try {

          const quote =
            await this.getCheckoutQuoteUseCase
              .execute(
                items
              );


          this.store.setState({

            checkout: {
              mode,

              items,

              quote
            },

            message: null,

            successOrder: null

          });


          document
            .getElementById(
              'checkoutSection'
            )
            .scrollIntoView({
              behavior: 'smooth'
            });


        } catch (error) {

          this.showError(
            error.message
          );

        }

      }


      async refreshCheckoutAfterCartChange() {

        const state =
          this.store.getState();


        if (
          state.checkout.mode !==
          'cart'
        ) {
          return;
        }


        const selected =
          new Set(
            state.selectedCartProductIds
          );


        const items =
          state.cart.filter(
            item =>
              selected.has(
                item.productId
              )
          );


        if (
          items.length === 0
        ) {

          this.store.setState({

            checkout: {
              mode: null,

              items: [],

              quote: null
            }

          });

          return;
        }


        try {

          const quote =
            await this.getCheckoutQuoteUseCase
              .execute(
                items
              );


          this.store.setState({

            checkout: {
              mode: 'cart',

              items,

              quote
            }

          });


        } catch {

          // Checkout will be refreshed
          // when user starts checkout again.
        }

      }


      async placeOrder(
        form
      ) {

        const state =
          this.store.getState();


        if (
          !state.checkout.items.length
        ) {
          this.showError(
            'Checkout items are empty'
          );

          return;
        }


        this.store.setState({
          submitting: true,
          message: null
        });


        try {

          const result =
            await this.placeOrderUseCase
              .execute(
                form,
                state.checkout.items
              );


          if (
            state.checkout.mode ===
            'cart'
          ) {

            const ids =
              state.checkout.items
                .map(
                  item =>
                    item.productId
                );


            const cart =
              this.cartRepository
                .removeMany(
                  ids
                );


            this.store.setState({
              cart
            });

          }


          this.store.setState({

            submitting: false,

            checkout: {
              mode: null,

              items: [],

              quote: null
            },

            successOrder:
              result,

            message: null

          });


          await this.reloadProducts();


          document
            .getElementById(
              'successSection'
            )
            .scrollIntoView({
              behavior: 'smooth'
            });


        } catch (error) {

          this.store.setState({

            submitting: false,

            message:
              error.message

          });

        }

      }


      async reloadProducts() {

        try {

          const data =
            await this.loadShopUseCase
              .execute();


          this.store.setState({

            products:
              data.products

          });

        } catch {
          // Keep current state.
        }

      }


      showError(
        message
      ) {

        this.store.setState({

          message

        });

      }


      getCartSummary() {

        const state =
          this.store.getState();


        return this.cartSummaryUseCase
          .execute(
            state.cart,
            state.products
          );
      }

    }


    /* =================================================
       MARK: - UI
       ================================================= */

    class ShopUI {

      constructor() {

        this.controller = null;
      }


      connect(
        controller
      ) {

        this.controller =
          controller;


        this.bindEvents();
      }


      bindEvents() {

        document.addEventListener(
          'click',
          event => {

            const target =
              event.target.closest(
                '[data-action]'
              );


            if (!target) {
              return;
            }


            const action =
              target.dataset.action;

            const productId =
              target.dataset.productId;


            if (
              action ===
              'add-cart'
            ) {

              const input =
                document.querySelector(
                  `[data-buy-quantity="${productId}"]`
                );


              const quantity =
                Number(
                  input?.value || 1
                );


              this.controller
                .addToCart(
                  productId,
                  quantity
                );
            }


            if (
              action ===
              'buy-now'
            ) {

              const input =
                document.querySelector(
                  `[data-buy-quantity="${productId}"]`
                );


              const quantity =
                Number(
                  input?.value || 1
                );


              this.controller
                .buyNow(
                  productId,
                  quantity
                );
            }


            if (
              action ===
              'cart-minus'
            ) {

              const quantity =
                Number(
                  target.dataset.quantity
                );


              this.controller
                .updateCartQuantity(
                  productId,
                  quantity - 1
                );
            }


            if (
              action ===
              'cart-plus'
            ) {

              const quantity =
                Number(
                  target.dataset.quantity
                );


              this.controller
                .updateCartQuantity(
                  productId,
                  quantity + 1
                );
            }


            if (
              action ===
              'cart-remove'
            ) {

              this.controller
                .removeFromCart(
                  productId
                );
            }


            if (
              action ===
              'checkout-cart'
            ) {

              this.controller
                .checkoutSelectedCart();
            }

          }
        );


        document.addEventListener(
          'change',
          event => {

            const checkbox =
              event.target.closest(
                '[data-cart-select]'
              );


            if (!checkbox) {
              return;
            }


            this.controller
              .toggleCartSelection(
                checkbox.dataset.productId,

                checkbox.checked
              );

          }
        );


        document
          .getElementById(
            'checkoutForm'
          )
          .addEventListener(
            'submit',
            event => {

              event.preventDefault();

              this.controller
                .placeOrder(
                  this.getCheckoutForm()
                );

            }
          );

      }


      getCheckoutForm() {

        return {

          customerName:
            document
              .getElementById(
                'customerName'
              )
              .value
              .trim(),

          phone:
            document
              .getElementById(
                'phone'
              )
              .value
              .trim(),

          email:
            document
              .getElementById(
                'email'
              )
              .value
              .trim(),

          address:
            document
              .getElementById(
                'address'
              )
              .value
              .trim(),

          province:
            document
              .getElementById(
                'province'
              )
              .value
              .trim(),

          district:
            document
              .getElementById(
                'district'
              )
              .value
              .trim(),

          ward:
            document
              .getElementById(
                'ward'
              )
              .value
              .trim(),

          note:
            document
              .getElementById(
                'note'
              )
              .value
              .trim(),

          paymentMethod:
            document
              .getElementById(
                'paymentMethod'
              )
              .value,

          shippingMethod:
            document
              .getElementById(
                'shippingMethod'
              )
              .value
        };
      }


      render(
        state
      ) {

        this.renderHeader(
          state
        );

        this.renderMessage(
          state.message
        );

        this.renderProducts(
          state.products
        );

        this.renderCart(
          state
        );

        this.renderCheckout(
          state
        );

        this.renderSuccess(
          state.successOrder
        );

        this.renderSubmitting(
          state.submitting
        );

      }


      renderHeader(
        state
      ) {

        const storeName =
          state.settings.storeName ||
          'Mini Shop';


        document
          .getElementById(
            'storeName'
          )
          .textContent =
          storeName;


        const cartCount =
          state.cart.reduce(
            (sum, item) =>
              sum + item.quantity,
            0
          );


        document
          .getElementById(
            'cartBadge'
          )
          .textContent =
          `Cart: ${cartCount}`;

      }


      renderMessage(
        message
      ) {

        const element =
          document.getElementById(
            'globalMessage'
          );


        if (!message) {

          element.className =
            'hidden';

          element.textContent =
            '';

          return;
        }


        element.className =
          'message message-error';


        element.textContent =
          message;

      }


      renderProducts(
        products
      ) {

        const container =
          document.getElementById(
            'products'
          );


        if (!products.length) {

          container.innerHTML = `
            <div class="empty">
              Không có sản phẩm
            </div>
          `;

          return;
        }


        container.innerHTML =
          products
            .map(
              product =>
                this.renderProductCard(
                  product
                )
            )
            .join('');

      }


      renderProductCard(
        product
      ) {

        const outOfStock =
          product.availableStock <= 0;


        const image =
          product.imageUrl
            ? `
              <img
                class="product-image"
                src="${escapeHtml(product.imageUrl)}"
                alt="${escapeHtml(product.name)}"
              >
            `
            : `
              <div
                class="product-image"
              ></div>
            `;


        const oldPrice =
          product.compareAtPrice >
          product.price
            ? `
              <span class="product-old-price">
                ${formatCurrency(
                  product.compareAtPrice
                )}
              </span>
            `
            : '';


        return `
          <article
            class="product-card"
          >

            ${image}

            <div
              class="product-content"
            >

              <div
                class="product-name"
              >
                ${escapeHtml(
                  product.name
                )}
              </div>


              <div
                class="product-category"
              >
                ${escapeHtml(
                  product.categoryName
                )}
              </div>


              <div
                class="product-description"
              >
                ${escapeHtml(
                  product.description
                )}
              </div>


              <div
                class="product-price"
              >
                ${formatCurrency(
                  product.price
                )}

                ${oldPrice}
              </div>


              <div
                class="product-stock"
              >
                ${
                  outOfStock
                    ? 'Hết hàng'
                    : `Còn ${product.availableStock} sản phẩm`
                }
              </div>


              <div
                class="product-actions"
              >

                <input
                  class="quantity-input"
                  type="number"
                  min="1"
                  max="${product.availableStock}"
                  value="1"
                  data-buy-quantity="${escapeHtml(product.productId)}"
                  ${outOfStock ? 'disabled' : ''}
                >


                <button
                  type="button"
                  class="button button-secondary"
                  data-action="add-cart"
                  data-product-id="${escapeHtml(product.productId)}"
                  ${outOfStock ? 'disabled' : ''}
                >
                  + Cart
                </button>


                <button
                  type="button"
                  class="button button-primary"
                  data-action="buy-now"
                  data-product-id="${escapeHtml(product.productId)}"
                  ${outOfStock ? 'disabled' : ''}
                >
                  Mua ngay
                </button>

              </div>

            </div>

          </article>
        `;
      }


      renderCart(
        state
      ) {

        const summary =
          this.controller
            .getCartSummary();


        const container =
          document.getElementById(
            'cartItems'
          );


        const footer =
          document.getElementById(
            'cartFooter'
          );


        if (!summary.items.length) {

          container.className =
            'empty';


          container.innerHTML =
            'Giỏ hàng trống';


          footer.classList.add(
            'hidden'
          );


          return;
        }


        container.className =
          '';


        container.innerHTML =
          summary.items
            .map(
              item =>
                this.renderCartItem(
                  item,
                  state
                )
            )
            .join('');


        footer.classList.remove(
          'hidden'
        );


        const selectedCount =
          state.selectedCartProductIds
            .size;


        document
          .getElementById(
            'cartSelectedCount'
          )
          .textContent =
          `${selectedCount} sản phẩm`;


        document
          .getElementById(
            'cartSubtotal'
          )
          .textContent =
          `Tạm tính: ${formatCurrency(
            summary.subtotal
          )}`;


        document
          .getElementById(
            'checkoutCartButton'
          )
          .disabled =
          selectedCount === 0;

      }


      renderCartItem(
        item,
        state
      ) {

        const checked =
          state
            .selectedCartProductIds
            .has(
              item.product.productId
            );


        const maxStock =
          item.product.availableStock;


        return `
          <div
            class="cart-item"
          >

            <input
              type="checkbox"
              data-cart-select
              data-product-id="${escapeHtml(item.product.productId)}"
              ${checked ? 'checked' : ''}
            >


            ${
              item.product.imageUrl
                ? `
                  <img
                    class="cart-image"
                    src="${escapeHtml(item.product.imageUrl)}"
                    alt="${escapeHtml(item.product.name)}"
                  >
                `
                : `
                  <div class="cart-image"></div>
                `
            }


            <div>

              <div
                class="cart-name"
              >
                ${escapeHtml(
                  item.product.name
                )}
              </div>


              <div
                class="cart-price"
              >
                ${formatCurrency(
                  item.product.price
                )}
              </div>

            </div>


            <div
              class="cart-quantity"
            >

              <button
                type="button"
                class="quantity-button"
                data-action="cart-minus"
                data-product-id="${escapeHtml(item.product.productId)}"
                data-quantity="${item.quantity}"
              >
                −
              </button>


              <strong>
                ${item.quantity}
              </strong>


              <button
                type="button"
                class="quantity-button"
                data-action="cart-plus"
                data-product-id="${escapeHtml(item.product.productId)}"
                data-quantity="${item.quantity}"
                ${
                  item.quantity >= maxStock
                    ? 'disabled'
                    : ''
                }
              >
                +
              </button>

            </div>


            <div
              class="cart-line-total"
            >

              <strong>
                ${formatCurrency(
                  item.subtotal
                )}
              </strong>


              <button
                type="button"
                class="button button-danger"
                style="margin-top: 6px"
                data-action="cart-remove"
                data-product-id="${escapeHtml(item.product.productId)}"
              >
                Xóa
              </button>

            </div>

          </div>
        `;
      }


      renderCheckout(
        state
      ) {

        const section =
          document.getElementById(
            'checkoutSection'
          );


        if (
          !state.checkout.items.length
        ) {

          section.classList.add(
            'hidden'
          );

          return;
        }


        section.classList.remove(
          'hidden'
        );


        const quote =
          state.checkout.quote;


        const items =
          quote
            ? quote.items
            : [];


        document
          .getElementById(
            'checkoutItems'
          )
          .innerHTML =
          items
            .map(
              item => `
                <div
                  class="checkout-item"
                >

                  <div>
                    ${escapeHtml(
                      item.name
                    )}
                    × ${item.quantity}
                  </div>

                  <strong>
                    ${formatCurrency(
                      item.subtotal
                    )}
                  </strong>

                </div>
              `
            )
            .join('');


        if (!quote) {
          return;
        }


        document
          .getElementById(
            'checkoutSummary'
          )
          .innerHTML = `

            <div class="summary-row">
              <span>
                Tạm tính
              </span>

              <strong>
                ${formatCurrency(
                  quote.subtotal
                )}
              </strong>
            </div>


            <div class="summary-row">
              <span>
                Phí vận chuyển
              </span>

              <strong>
                ${formatCurrency(
                  quote.shippingFee
                )}
              </strong>
            </div>


            <div class="summary-row">
              <span>
                Giảm giá
              </span>

              <strong>
                ${formatCurrency(
                  quote.discount
                )}
              </strong>
            </div>


            <div
              class="summary-row summary-total"
            >
              <span>
                Tổng
              </span>

              <strong>
                ${formatCurrency(
                  quote.total
                )}
              </strong>
            </div>

          `;

      }


      renderSubmitting(
        submitting
      ) {

        const button =
          document.getElementById(
            'placeOrderButton'
          );


        button.disabled =
          submitting;


        button.textContent =
          submitting
            ? 'Đang đặt hàng...'
            : 'Đặt hàng';

      }


      renderSuccess(
        order
      ) {

        const section =
          document.getElementById(
            'successSection'
          );


        if (!order) {

          section.classList.add(
            'hidden'
          );

          return;
        }


        section.classList.remove(
          'hidden'
        );


        document
          .getElementById(
            'successOrderId'
          )
          .textContent =
          order.orderId;


        document
          .getElementById(
            'successOrderCode'
          )
          .textContent =
          order.orderCode;


        document
          .getElementById(
            'successTotal'
          )
          .textContent =
          formatCurrency(
            order.total
          );

      }

    }


    /* =================================================
       MARK: - Formatting
       ================================================= */

    function formatCurrency(
      value
    ) {

      return Number(
        value || 0
      )
        .toLocaleString(
          'vi-VN'
        ) + ' ₫';

    }


    function escapeHtml(
      value
    ) {

      return String(
        value ?? ''
      )
        .replaceAll(
          '&',
          '&amp;'
        )
        .replaceAll(
          '<',
          '&lt;'
        )
        .replaceAll(
          '>',
          '&gt;'
        )
        .replaceAll(
          '"',
          '&quot;'
        )
        .replaceAll(
          "'",
          '&#039;'
        );

    }


    /* =================================================
       MARK: - Composition Root
       ================================================= */

    const apiRepository =
      new ApiRepository(
        CONFIG.API_URL
      );


    const cartRepository =
      new LocalStorageCartRepository(
        CONFIG.CART_STORAGE_KEY
      );


    const store =
      new AppStore();


    const ui =
      new ShopUI();


    const loadShopUseCase =
      new LoadShopUseCase(
        apiRepository
      );


    const addToCartUseCase =
      new AddToCartUseCase(
        cartRepository
      );


    const updateCartQuantityUseCase =
      new UpdateCartQuantityUseCase(
        cartRepository
      );


    const removeFromCartUseCase =
      new RemoveFromCartUseCase(
        cartRepository
      );


    const buyNowUseCase =
      new BuyNowUseCase();


    const checkoutCartUseCase =
      new CheckoutCartUseCase();


    const getCheckoutQuoteUseCase =
      new GetCheckoutQuoteUseCase(
        apiRepository
      );


    const placeOrderUseCase =
      new PlaceOrderUseCase(
        apiRepository
      );


    const cartSummaryUseCase =
      new CartSummaryUseCase();


    const controller =
      new ShopController(

        store,

        loadShopUseCase,

        addToCartUseCase,

        updateCartQuantityUseCase,

        removeFromCartUseCase,

        buyNowUseCase,

        checkoutCartUseCase,

        getCheckoutQuoteUseCase,

        placeOrderUseCase,

        cartRepository,

        cartSummaryUseCase

      );


    ui.connect(
      controller
    );


    store.subscribe(
      state =>
        ui.render(state)
    );


    controller.init();

  </script>
