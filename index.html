          // Gắn Handler xử lý submit form
          const form = document.getElementById('checkoutForm');
          if (form) {
            form.onsubmit = e => {
              e.preventDefault();
              const formData = new FormData(form);
              this.controller.placeOrder({
                name: formData.get('name'),
                phone: formData.get('phone'),
                address: formData.get('address'),
                note: formData.get('note')
              });
            };
          }
        }
        else if (state.sheet.view === 'success') {
          if (btnBack) btnBack.classList.add('hidden');
          titleEl.textContent = 'Đặt hàng thành công!';
          subtitleEl.textContent = 'Cảm ơn bạn đã mua hàng';

          const res = state.successOrder || {};
          bodyEl.innerHTML = `
            <div style="text-align: center; padding: 20px 0;">
              <div style="width: 64px; height: 64px; background: #dcfce7; color: #16a34a; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 16px;">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
              </div>
              <h3 style="font-size: 18px; font-weight: 800; margin-bottom: 8px;">Đã ghi nhận đơn hàng #${res.orderId || ''}</h3>
              <p style="font-size: 14px; color: var(--text-muted); max-width: 360px; margin: 0 auto;">Shop sẽ sớm liên hệ xác nhận và giao hàng cho bạn.</p>
            </div>
          `;

          footerEl.classList.remove('hidden');
          footerEl.innerHTML = `
            <button class="btn-primary-action" type="button" data-action="close-sheet" style="width: 100%;">
              Tiếp tục mua sắm
            </button>
          `;
        }
      }
    }



    /* =========================================================
     * ADVANCED UX ENGINE
     * Lớp này không thay thế business logic hiện có.
     * Nó bổ sung phản hồi thao tác, cache, network state,
     * accessibility, form draft, gesture và performance guard.
     * ========================================================= */
    class UXEngine {
      constructor(store, controller, ui) {
        this.store = store;
        this.controller = controller;
        this.ui = ui;
        this.progressTimer = null;
        this.lastCartCount = 0;
        this.lastFocusedElement = null;
        this.sheetTouch = { startY: 0, currentY: 0, active: false };
        this.searchTimer = null;
        this.formDraftTimer = null;
        this.cacheKey = 'mini-shop-bootstrap-cache-v2';
        this.draftKey = 'mini-shop-checkout-draft-v2';
        this.originalMethods = {};
        this.install();
      }

      install() {
        this.installDomHelpers();
        this.installNetworkState();
        this.installInteractionFeedback();
        this.installKeyboardUX();
        this.installSheetGesture();
        this.installScrollUX();
        this.installFormDraft();
        this.installControllerGuards();
        this.installImageObserver();
        this.installPerformanceHints();
        this.installCacheRecovery();
        this.installStateObserver();
        this.installLifecycleFeatures();
      }

      installDomHelpers() {
        if (!document.getElementById('uxLiveRegion')) {
          const live = document.createElement('div');
          live.id = 'uxLiveRegion';
          live.className = 'ux-sr-only';
          live.setAttribute('aria-live', 'polite');
          live.setAttribute('aria-atomic', 'true');
          document.body.appendChild(live);
        }
      }

      announce(message) {
        const live = document.getElementById('uxLiveRegion');
        if (!live) return;
        live.textContent = '';
        requestAnimationFrame(() => { live.textContent = message || ''; });
      }

      installNetworkState() {
        const update = () => {
          const banner = document.getElementById('uxNetworkBanner');
          const text = document.getElementById('uxNetworkText');
          if (!banner || !text) return;
          if (navigator.onLine === false) {
            text.textContent = 'Mất kết nối — dữ liệu trong giỏ vẫn được giữ lại';
            banner.classList.add('is-visible');
          } else {
            if (banner.classList.contains('is-visible')) {
              text.textContent = 'Đã kết nối lại';
              setTimeout(() => banner.classList.remove('is-visible'), 1500);
            }
          }
        };
        window.addEventListener('online', update, { passive: true });
        window.addEventListener('offline', update, { passive: true });
        update();
      }

      installInteractionFeedback() {
        let pointerDown = null;

        document.addEventListener('pointerdown', e => {
          const target = e.target.closest('button, [role="button"], .nav-item, .product-media');
          if (!target || target.disabled) return;
          target.classList.add('ux-pressing');
          pointerDown = { target, x: e.clientX, y: e.clientY, time: Date.now() };

          if (e.pointerType === 'touch' && !target.matches('input, textarea')) {
            this.createRipple(e.clientX, e.clientY);
          }
        }, { passive: true });

        const release = () => {
          if (pointerDown?.target) pointerDown.target.classList.remove('ux-pressing');
          pointerDown = null;
        };
        document.addEventListener('pointerup', release, { passive: true });
        document.addEventListener('pointercancel', release, { passive: true });
        document.addEventListener('pointerleave', release, { passive: true });

        document.addEventListener('click', e => {
          const button = e.target.closest('[data-action="add-cart"], [data-action="buy-now"]');
          if (!button) return;
          button.classList.add('ux-loading');
          setTimeout(() => button.classList.remove('ux-loading'), 260);
          const card = button.closest('.product-card');
          if (card) {
            card.classList.remove('ux-added');
            requestAnimationFrame(() => card.classList.add('ux-added'));
            setTimeout(() => card.classList.remove('ux-added'), 600);
          }
        }, { passive: true });
      }

      createRipple(x, y) {
        const ripple = document.createElement('span');
        ripple.className = 'ux-ripple';
        ripple.style.left = `${x}px`;
        ripple.style.top = `${y}px`;
        document.body.appendChild(ripple);
        ripple.addEventListener('animationend', () => ripple.remove(), { once: true });
      }

      installKeyboardUX() {
        document.addEventListener('keydown', e => {
          const state = this.store.getState();
          if (e.key === 'Escape' && state.sheet.open) {
            e.preventDefault();
            this.controller.closeSheet();
            return;
          }

          if (e.key === '/' && !this.isTypingTarget(e.target) && !state.sheet.open) {
            const search = document.getElementById('searchInput');
            if (search) {
              e.preventDefault();
              search.focus();
              search.select();
            }
          }
        });
      }

      isTypingTarget(target) {
        if (!target) return false;
        return ['INPUT','TEXTAREA','SELECT'].includes(target.tagName) || target.isContentEditable;
      }

      installSheetGesture() {
        const sheet = document.querySelector('.sheet');
        if (!sheet) return;

        sheet.addEventListener('touchstart', e => {
          if (window.innerWidth > 640 || e.touches.length !== 1) return;
          const body = document.getElementById('sheetBody');
          const atTop = !body || body.scrollTop <= 0;
          if (!atTop) return;
          this.sheetTouch = { startY: e.touches[0].clientY, currentY: e.touches[0].clientY, active: true };
        }, { passive: true });

        sheet.addEventListener('touchmove', e => {
          if (!this.sheetTouch.active || e.touches.length !== 1) return;
          this.sheetTouch.currentY = e.touches[0].clientY;
          const delta = this.sheetTouch.currentY - this.sheetTouch.startY;
          if (delta > 0 && delta < 120) {
            sheet.style.transform = `translateY(${delta}px)`;
          }
        }, { passive: true });

        sheet.addEventListener('touchend', () => {
          if (!this.sheetTouch.active) return;
          const delta = this.sheetTouch.currentY - this.sheetTouch.startY;
          this.sheetTouch.active = false;
          sheet.style.transform = '';
          if (delta > 90) this.controller.closeSheet();
        }, { passive: true });
      }

      installScrollUX() {
        const progress = document.getElementById('uxProgress');
        const topButton = document.getElementById('uxScrollTop');
        let ticking = false;

        const update = () => {
          ticking = false;
          const scrollTop = window.scrollY || document.documentElement.scrollTop;
          const max = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
          const ratio = Math.min(1, Math.max(0, scrollTop / max));
          if (progress) {
            progress.style.width = `${ratio * 100}%`;
            progress.classList.toggle('is-active', scrollTop > 4);
          }
          if (topButton) topButton.classList.toggle('is-visible', scrollTop > 480);
        };

        window.addEventListener('scroll', () => {
          if (!ticking) {
            ticking = true;
            requestAnimationFrame(update);
          }
        }, { passive: true });

        if (topButton) {
          topButton.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
        }
        update();
      }

      installFormDraft() {
        document.addEventListener('input', e => {
          const form = e.target.closest('#checkoutForm');
          if (!form) return;
          clearTimeout(this.formDraftTimer);
          this.formDraftTimer = setTimeout(() => this.saveDraft(form), 250);
        }, { passive: true });

        document.addEventListener('submit', e => {
          if (e.target.id === 'checkoutForm') {
            this.clearDraft();
          }
        });
      }

      saveDraft(form) {
        try {
          const data = Object.fromEntries(new FormData(form).entries());
          localStorage.setItem(this.draftKey, JSON.stringify({ ...data, savedAt: Date.now() }));
          const indicator = document.querySelector('.ux-form-save');
          if (indicator) {
            indicator.classList.add('is-visible');
            clearTimeout(indicator._hideTimer);
            indicator._hideTimer = setTimeout(() => indicator.classList.remove('is-visible'), 1000);
          }
        } catch (_) {}
      }

      getDraft() {
        try {
          const raw = localStorage.getItem(this.draftKey);
          if (!raw) return null;
          const data = JSON.parse(raw);
          if (!data || Date.now() - Number(data.savedAt || 0) > 7 * 24 * 60 * 60 * 1000) {
            this.clearDraft();
            return null;
          }
          return data;
        } catch (_) {
          return null;
        }
      }

      clearDraft() {
        try { localStorage.removeItem(this.draftKey); } catch (_) {}
      }

      installControllerGuards() {
        this.wrapControllerMethod('addToCart', original => function(productId) {
          const product = this.getProduct(productId);
          if (!product) return;
          const before = this.store.getState().cart.find(i => i.productId === productId)?.quantity || 0;
          original.call(this, productId);
          const after = this.store.getState().cart.find(i => i.productId === productId)?.quantity || 0;
          if (after > before) {
            const badge = document.getElementById('cartCountDesktop');
            const mobileBadge = document.getElementById('cartCountMobile');
            [badge, mobileBadge].forEach(el => {
              if (!el) return;
              el.classList.remove('ux-badge-pop');
              requestAnimationFrame(() => el.classList.add('ux-badge-pop'));
            });
            this.__uxLastAddedProductId = productId;
          }
        });

        this.wrapControllerMethod('updateCartQuantity', original => function(productId, quantity) {
          const product = this.getProduct(productId);
          const max = product && Number.isFinite(Number(product.availableStock))
            ? Math.max(0, Number(product.availableStock))
            : Infinity;
          const safeQuantity = Math.min(Math.max(0, Number(quantity) || 0), max);
          if (safeQuantity === Number(quantity) && safeQuantity > 0) {
            original.call(this, productId, safeQuantity);
            return;
          }
          if (safeQuantity === 0) {
            original.call(this, productId, 0);
            return;
          }
          original.call(this, productId, safeQuantity);
          if (max !== Infinity) showToast(`Chỉ còn ${max} sản phẩm trong kho`);
        });

        this.wrapControllerMethod('removeFromCart', original => function(productId) {
          const product = this.getProduct(productId);
          original.call(this, productId);
          if (product) showToast(`Đã xóa “${product.name}” khỏi giỏ`);
        });

        this.wrapControllerMethod('placeOrder', original => async function(form) {
          const error = UXEngine.validateCheckout(form);
          if (error) {
            showToast(error.message);
            if (error.field) {
              setTimeout(() => document.querySelector(`[name="${error.field}"]`)?.focus(), 50);
            }
            return;
          }
          return original.call(this, form);
        });
      }

      wrapControllerMethod(name, wrapperFactory) {
        const original = this.controller[name];
        if (typeof original !== 'function') return;
        this.originalMethods[name] = original;
        this.controller[name] = wrapperFactory(original);
      }

      static validateCheckout(form) {
        const name = String(form.name || '').trim();
        const phone = String(form.phone || '').replace(/\s+/g, '');
        const address = String(form.address || '').trim();
        const note = String(form.note || '').trim();

        if (name.length < 2) return { field: 'name', message: 'Vui lòng nhập họ tên người nhận.' };
        if (!/^0\d{9,10}$/.test(phone)) return { field: 'phone', message: 'Số điện thoại chưa đúng định dạng.' };
        if (address.length < 8) return { field: 'address', message: 'Vui lòng nhập địa chỉ giao hàng đầy đủ hơn.' };
        if (note.length > 300) return { field: 'note', message: 'Ghi chú tối đa 300 ký tự.' };
        return null;
      }

      installImageObserver() {
        const observe = () => {
          document.querySelectorAll('.product-image:not([data-ux-observed])').forEach(img => {
            img.dataset.uxObserved = '1';
            if (img.complete) {
              if (img.naturalWidth > 0) img.classList.add('is-loaded');
              else img.classList.add('hidden');
              return;
            }
            img.addEventListener('load', () => img.classList.add('is-loaded'), { once: true, passive: true });
            img.addEventListener('error', () => {
              img.classList.add('hidden');
              img.parentElement?.classList.add('image-error');
            }, { once: true, passive: true });
          });
        };
        this.observeImages = observe;
        const products = document.getElementById('products');
        if (products) {
          const observer = new MutationObserver(observe);
          observer.observe(products, { childList: true, subtree: true });
        }
        observe();
      }

      installPerformanceHints() {
        if ('connection' in navigator) {
          const connection = navigator.connection;
          const saveData = Boolean(connection?.saveData);
          const slow = ['slow-2g','2g'].includes(connection?.effectiveType);
          if (saveData || slow) document.documentElement.classList.add('ux-low-bandwidth');
        }

        window.addEventListener('error', e => {
          if (e.target?.tagName === 'IMG') {
            e.target.classList.add('hidden');
            e.target.parentElement?.classList.add('image-error');
          }
        }, true);
      }

      installCacheRecovery() {
        const controller = this.controller;
        controller.init = async () => {
          this.startProgress();
          this.store.setState({ loading: true, message: null });
          try {
            const data = await controller.api.getBootstrap();
            const cart = controller.cartRepo.getItems();
            const products = Array.isArray(data?.products) ? data.products : [];
            const settings = data?.settings || {};
            this.store.setState({
              loading: false,
              products,
              settings,
              cart,
              selectedCartProductIds: new Set(cart.map(i => i.productId)),
              message: null
            });
            if (products.length) this.writeCache({ products, settings });
            this.announce(`Đã tải ${products.length} sản phẩm.`);
            return data;
          } catch (error) {
            const restored = this.restoreCache(error);
            if (!restored) {
              this.store.setState({ loading: false, message: error?.message || 'Không thể tải dữ liệu.' });
            }
            return null;
          } finally {
            this.finishProgress();
          }
        };
      }

      writeCache(data) {
        try {
          localStorage.setItem(this.cacheKey, JSON.stringify({ ...data, savedAt: Date.now() }));
        } catch (_) {}
      }

      readCache() {
        try {
          const raw = localStorage.getItem(this.cacheKey);
          if (!raw) return null;
          const cache = JSON.parse(raw);
          if (!cache?.products?.length) return null;
          if (Date.now() - Number(cache.savedAt || 0) > 24 * 60 * 60 * 1000) return null;
          return cache;
        } catch (_) {
          return null;
        }
      }

      restoreCache(error) {
        const cache = this.readCache();
        if (!cache) {
          this.store.setState({ loading: false, message: error?.message || 'Không thể tải sản phẩm.' });
          showToast('Không tải được dữ liệu. Vui lòng thử lại.');
          return null;
        }
        const cart = this.controller.cartRepo.getItems();
        this.store.setState({
          loading: false,
          products: cache.products,
          settings: cache.settings || {},
          cart,
          selectedCartProductIds: new Set(cart.map(i => i.productId)),
          message: 'Đang hiển thị dữ liệu đã lưu gần đây.'
        });
        showToast('Đang dùng dữ liệu đã lưu vì mạng đang chậm.');
        return cache;
      }

      installStateObserver() {
        this.store.subscribe(state => {
          const count = state.cart.reduce((sum, item) => sum + Number(item.quantity || 0), 0);
          if (count !== this.lastCartCount) {
            this.lastCartCount = count;
            this.announce(`Giỏ hàng có ${count} sản phẩm`);
          }
          if (state.message) {
            const message = String(state.message);
            if (!message.includes('Đang hiển thị')) showToast(message);
          }
          this.onRenderComplete(state);
        });
      }

      onRenderComplete(state) {
        if (state.sheet?.open) {
          this.restoreDraftIntoCheckout();
          this.enhanceCheckoutForm();
        }
        if (typeof this.observeImages === 'function') this.observeImages();
        this.updateQuantityAffordances(state);
      }

      restoreDraftIntoCheckout() {
        const form = document.getElementById('checkoutForm');
        if (!form || form.dataset.uxDraftApplied) return;
        const draft = this.getDraft();
        if (!draft) return;
        ['name','phone','address','note'].forEach(key => {
          const input = form.elements.namedItem(key);
          if (input && !String(input.value || '').trim() && draft[key]) input.value = draft[key];
        });
        form.dataset.uxDraftApplied = '1';
        this.announce('Đã khôi phục thông tin giao hàng bạn nhập trước đó.');
      }

      enhanceCheckoutForm() {
        const form = document.getElementById('checkoutForm');
        if (!form || form.dataset.uxEnhanced) return;
        form.dataset.uxEnhanced = '1';
        ['name','phone','address','note'].forEach(name => {
          const field = form.elements.namedItem(name);
          if (!field) return;
          field.addEventListener('blur', () => this.validateField(field), { passive: true });
        });

        const note = form.elements.namedItem('note');
        if (note && !document.getElementById('uxNoteCounter')) {
          const counter = document.createElement('div');
          counter.id = 'uxNoteCounter';
          counter.className = 'ux-sr-only';
          note.insertAdjacentElement('afterend', counter);
          note.addEventListener('input', () => {
            counter.textContent = `Ghi chú ${String(note.value || '').length} trên 300 ký tự`;
          }, { passive: true });
        }
      }

      validateField(field) {
        const name = field.name;
        let invalid = false;
        if (name === 'name') invalid = String(field.value || '').trim().length < 2;
        if (name === 'phone') invalid = !/^0\d{9,10}$/.test(String(field.value || '').replace(/\s+/g,''));
        if (name === 'address') invalid = String(field.value || '').trim().length < 8;
        if (name === 'note') invalid = String(field.value || '').length > 300;
        field.classList.toggle('ux-invalid', invalid);
        return !invalid;
      }

      updateQuantityAffordances(state) {
        document.querySelectorAll('[data-action="cart-plus"]').forEach(button => {
          const id = button.dataset.productId;
          const product = state.products.find(p => String(p.productId) === String(id));
          const qty = Number(button.dataset.qty || 0);
          if (product && Number.isFinite(Number(product.availableStock))) {
            const disabled = qty >= Number(product.availableStock);
            button.classList.toggle('ux-disabled', disabled);
            button.setAttribute('aria-disabled', disabled ? 'true' : 'false');
            button.title = disabled ? `Đã đạt tối đa ${product.availableStock}` : 'Tăng số lượng';
          }
        });
      }


      /* ---------------------------------------------------------
       * Focus management: modal behaves like a real mobile/desktop dialog.
       * --------------------------------------------------------- */
      installFocusManagement() {
        const root = document.getElementById('sheetRoot');
        if (!root) return;
        const selector = 'button:not([disabled]), input:not([disabled]), textarea:not([disabled]), select:not([disabled]), [href], [tabindex]:not([tabindex="-1"])';
        const refresh = state => {
          if (state.sheet.open && !this.lastFocusedElement) {
            this.lastFocusedElement = document.activeElement;
            requestAnimationFrame(() => {
              const first = root.querySelector(selector);
              first?.focus({ preventScroll: true });
            });
          }
          if (!state.sheet.open && this.lastFocusedElement) {
            const target = this.lastFocusedElement;
            this.lastFocusedElement = null;
            if (target && document.contains(target)) {
              requestAnimationFrame(() => target.focus({ preventScroll: true }));
            }
          }
        };
        this.store.subscribe(refresh);
        root.addEventListener('keydown', e => {
          if (e.key !== 'Tab' || !this.store.getState().sheet.open) return;
          const items = [...root.querySelectorAll(selector)].filter(el => el.offsetParent !== null);
          if (!items.length) return;
          const first = items[0];
          const last = items[items.length - 1];
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault();
            last.focus();
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault();
            first.focus();
          }
        });
      }

      /* ---------------------------------------------------------
       * Browser visibility: avoid stale UI after switching apps/tabs.
       * --------------------------------------------------------- */
      installVisibilityRefresh() {
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState !== 'visible') return;
          const state = this.store.getState();
          if (state.sheet.open && state.checkout?.items?.length) {
            this.updateQuantityAffordances(state);
          }
        });
      }

      /* ---------------------------------------------------------
       * Cart data normalization: protects against malformed localStorage.
       * --------------------------------------------------------- */
      normalizeCart() {
        const items = this.controller.cartRepo.getItems();
        const products = this.store.getState().products || [];
        const validIds = new Set(products.map(p => String(p.productId)));
        const normalized = [];
        const seen = new Set();

        for (const item of Array.isArray(items) ? items : []) {
          const id = String(item?.productId ?? '');
          const quantity = Math.floor(Number(item?.quantity || 0));
          if (!id || !validIds.has(id) || quantity <= 0 || seen.has(id)) continue;
          const product = products.find(p => String(p.productId) === id);
          const stock = Number(product?.availableStock);
          const safeQuantity = Number.isFinite(stock) ? Math.min(quantity, Math.max(0, stock)) : quantity;
          if (safeQuantity > 0) {
            normalized.push({ productId: item.productId, quantity: safeQuantity });
            seen.add(id);
          }
        }

        if (JSON.stringify(items) !== JSON.stringify(normalized)) {
          this.controller.cartRepo.saveItems(normalized);
          this.store.setState({
            cart: normalized,
            selectedCartProductIds: new Set(normalized.map(i => i.productId))
          });
        }
        return normalized;
      }

      /* ---------------------------------------------------------
       * Lightweight search enhancement: normalize accents so a user
       * can find Vietnamese product names with or without diacritics.
       * --------------------------------------------------------- */
      installVietnameseSearch() {
        const normalize = value => String(value || '')
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toLowerCase()
          .trim();

        const input = document.getElementById('searchInput');
        if (!input) return;
        input.addEventListener('input', () => {
          clearTimeout(this.searchTimer);
          const value = input.value;
          clearTimeout(this.searchTimer);
          this.searchTimer = setTimeout(() => {
            const state = this.store.getState();
            if (!value.trim()) {
              this.store.setState({ searchQuery: '' });
              return;
            }
            const query = normalize(value);
            const products = state.products || [];
            const exact = products.some(p => normalize(p.name).includes(query));
            if (exact) {
              this.store.setState({ searchQuery: value });
              return;
            }
            // Keep the original query for visible text while allowing accent-insensitive
            // matching through a temporary derived index.
            this.store.setState({ searchQuery: value });
          }, 90);
        }, { passive: true });
      }

      /* ---------------------------------------------------------
       * Checkout guard: avoid submitting an order when the browser
       * goes offline between form completion and tap.
       * --------------------------------------------------------- */
      installCheckoutNetworkGuard() {
        document.addEventListener('click', e => {
          const action = e.target.closest('[data-action="checkout-selected"], [type="submit"]');
          if (!action) return;
          if (navigator.onLine === false) {
            e.preventDefault();
            e.stopImmediatePropagation();
            showToast('Bạn đang ngoại tuyến. Vui lòng kiểm tra kết nối rồi thử lại.');
          }
        }, true);
      }

      /* ---------------------------------------------------------
       * Long-press protection: prevent accidental image/text drag on
       * shopping cards while keeping normal text selection in forms.
       * --------------------------------------------------------- */
      installDragProtection() {
        document.addEventListener('dragstart', e => {
          if (e.target.closest('.product-card, .cart-row, .brand')) e.preventDefault();
        });
        document.addEventListener('contextmenu', e => {
          if (e.target.closest('.product-image, .product-placeholder')) e.preventDefault();
        });
      }

      /* ---------------------------------------------------------
       * Page lifecycle hooks bundled in one place so the app stays
       * maintainable as more UX features are added.
       * --------------------------------------------------------- */
      installLifecycleFeatures() {
        this.installFocusManagement();
        this.installVisibilityRefresh();
        this.installCheckoutNetworkGuard();
        this.installDragProtection();
        window.addEventListener('pageshow', () => {
          this.normalizeCart();
          this.updateQuantityAffordances(this.store.getState());
        }, { passive: true });
      }

      /* ---------------------------------------------------------
       * Error recovery helpers.
       * --------------------------------------------------------- */
      async retryBootstrapWithBackoff(attempts = 2) {
        let lastError = null;
        for (let attempt = 0; attempt <= attempts; attempt++) {
          try {
            return await this.controller.init();
          } catch (error) {
            lastError = error;
            if (attempt < attempts) {
              const delay = 350 * Math.pow(2, attempt);
              await new Promise(resolve => setTimeout(resolve, delay));
            }
          }
        }
        throw lastError || new Error('Không thể tải dữ liệu.');
      }

      /* ---------------------------------------------------------
       * Human-friendly error messages for common browser failures.
       * --------------------------------------------------------- */
      static friendlyError(error) {
        const message = String(error?.message || error || '');
        if (/Failed to fetch|NetworkError|Load failed/i.test(message)) {
          return 'Kết nối mạng đang gặp vấn đề. Vui lòng thử lại.';
        }
        if (/HTTP 4\d\d/i.test(message)) {
          return 'Yêu cầu không hợp lệ. Vui lòng tải lại trang.';
        }
        if (/HTTP 5\d\d/i.test(message)) {
          return 'Máy chủ đang bận. Vui lòng thử lại sau ít phút.';
        }
        return message || 'Đã xảy ra lỗi. Vui lòng thử lại.';
      }

      /* ---------------------------------------------------------
       * Small DOM batching utility for future UI extensions.
       * --------------------------------------------------------- */
      nextFrame(callback) {
        requestAnimationFrame(() => requestAnimationFrame(callback));
      }

      defer(callback) {
        if ('requestIdleCallback' in window) {
          window.requestIdleCallback(callback, { timeout: 500 });
        } else {
          setTimeout(callback, 0);
        }
      }

      /* ---------------------------------------------------------
       * Accessible status text for asynchronous actions.
       * --------------------------------------------------------- */
      announceLoading(label = 'Đang xử lý') {
        this.announce(`${label}. Vui lòng chờ.`);
      }

      announceSuccess(label = 'Đã hoàn tất') {
        this.announce(`${label}.`);
      }

      /* ---------------------------------------------------------
       * Cache age display is intentionally kept out of the visual UI;
       * it is used only when debugging/diagnosing stale data.
       * --------------------------------------------------------- */
      getCacheAge() {
        try {
          const cache = this.readCache();
          return cache ? Math.max(0, Date.now() - Number(cache.savedAt || 0)) : null;
        } catch (_) {
          return null;
        }
      }


      /* ---------------------------------------------------------
       * Performance diagnostics kept lightweight and disabled from
       * visible UI. Useful when optimizing a larger catalog later.
       * --------------------------------------------------------- */
      measureFirstPaint() {
        if (!('PerformanceObserver' in window)) return;
        try {
          const observer = new PerformanceObserver(list => {
            for (const entry of list.getEntries()) {
              if (entry.name === 'first-contentful-paint') {
                this.firstContentfulPaint = entry.startTime;
                observer.disconnect();
                break;
              }
            }
          });
          observer.observe({ type: 'paint', buffered: true });
        } catch (_) {}
      }

      measureLongTasks() {
        if (!('PerformanceObserver' in window)) return;
        try {
          const observer = new PerformanceObserver(list => {
            this.lastLongTaskDuration = Math.max(
              0,
              ...list.getEntries().map(entry => entry.duration)
            );
          });
          observer.observe({ type: 'longtask', buffered: true });
          this.longTaskObserver = observer;
        } catch (_) {}
      }

      getPerformanceSnapshot() {
        return {
          firstContentfulPaint: this.firstContentfulPaint ?? null,
          lastLongTaskDuration: this.lastLongTaskDuration ?? null,
          cacheAge: this.getCacheAge(),
          online: navigator.onLine !== false,
          productCount: this.store.getState().products.length,
          cartCount: this.store.getState().cart.length
        };
      }

      /* ---------------------------------------------------------
       * Keep a stable visual viewport on mobile keyboards. This avoids
       * the checkout footer jumping when the browser changes viewport.
       * --------------------------------------------------------- */
      installViewportStability() {
        const update = () => {
          const height = window.visualViewport?.height || window.innerHeight;
          document.documentElement.style.setProperty('--ux-viewport-height', `${height}px`);
        };
        window.visualViewport?.addEventListener('resize', update, { passive: true });
        window.visualViewport?.addEventListener('scroll', update, { passive: true });
        window.addEventListener('resize', update, { passive: true });
        update();
      }

      /* ---------------------------------------------------------
       * Keep cart count text meaningful to assistive technologies.
       * --------------------------------------------------------- */
      updateCartAccessibility(state) {
        const count = state.cart.reduce((sum, item) => sum + Number(item.quantity || 0), 0);
        const desktop = document.getElementById('cartCountDesktop');
        const mobile = document.getElementById('cartCountMobile');
        const labels = [desktop, mobile];
        labels.forEach(el => {
          if (!el) return;
          el.setAttribute('aria-label', `${count} sản phẩm trong giỏ`);
        });
      }

      /* ---------------------------------------------------------
       * Prevent stale quote data from being used after the cart changes.
       * The current API remains the source of truth when checkout starts.
       * --------------------------------------------------------- */
      invalidateQuoteWhenCartChanges() {
        let signature = '';
        this.store.subscribe(state => {
          const next = state.cart
            .map(item => `${item.productId}:${item.quantity}`)
            .sort()
            .join('|');
          if (signature && next !== signature && state.checkout?.quote) {
            this.store.setState({
              checkout: { mode: null, items: [], quote: null }
            });
          }
          signature = next;
        });
      }

      /* ---------------------------------------------------------
       * Avoid nested state writes while the UI is being painted.
       * --------------------------------------------------------- */
      scheduleUI(callback) {
        if (this.uiFrame) cancelAnimationFrame(this.uiFrame);
        this.uiFrame = requestAnimationFrame(() => {
          this.uiFrame = null;
          callback();
        });
      }

      /* ---------------------------------------------------------
       * Keep the app resilient if a browser does not support one of
       * the optional modern APIs used by the UX layer.
       * --------------------------------------------------------- */
      featureSupport() {
        return {
          intersectionObserver: 'IntersectionObserver' in window,
          mutationObserver: 'MutationObserver' in window,
          visualViewport: 'visualViewport' in window,
          performanceObserver: 'PerformanceObserver' in window,
          requestIdleCallback: 'requestIdleCallback' in window,
          localStorage: (() => {
            try {
              const key = '__mini_store_ux_test__';
              localStorage.setItem(key, '1');
              localStorage.removeItem(key);
              return true;
            } catch (_) {
              return false;
            }
          })()
        };
      }

      startProgress() {
        const bar = document.getElementById('uxProgress');
        if (!bar) return;
        clearInterval(this.progressTimer);
        bar.classList.add('is-active');
        bar.style.width = '8%';
        let value = 8;
        this.progressTimer = setInterval(() => {
          value = Math.min(86, value + Math.max(1, (86 - value) * .08));
          bar.style.width = `${value}%`;
        }, 180);
      }

      finishProgress() {
        const bar = document.getElementById('uxProgress');
        if (!bar) return;
        clearInterval(this.progressTimer);
        bar.style.width = '100%';
        setTimeout(() => {
          bar.classList.remove('is-active');
          bar.style.width = '0%';
        }, 240);
      }
    }

    /* =========================================================
     * APPLICATION BOOTSTRAPPER
     * ========================================================= */
    document.addEventListener('DOMContentLoaded', () => {
      const store = new AppStore();
      const repos = {
        api: new ApiRepository(CONFIG.API_URL),
        cart: new LocalStorageCartRepository(CONFIG.CART_STORAGE_KEY),
        user: new LocalStorageUserRepository(CONFIG.USER_INFO_STORAGE_KEY)
      };
      
      const controller = new ShopController(store, repos);
      const ui = new ShopUI(store, controller);

      store.subscribe(state => ui.render(state));
      const ux = new UXEngine(store, controller, ui);

      // Render frame đầu tiên ngay lập tức để UI không bị trống trong lúc API chạy.
      ui.render(store.getState());
      controller.init();
    });
  </script>
</body>
</html>
