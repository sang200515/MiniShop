/* =====================================================
 MARK: - Configuration
 ===================================================== */

const CONFIG = {

  API_URL:
    'https://script.google.com/macros/s/AKfycbxZZimUCvCIKSj1FBmKlag6gtf4mmaQxG3bPsAGe8QX0GUttRrDjz0Bm4rhV9GoGFvUKQ/exec',

  TOKEN_KEY:
    'mini-shop-admin-token'

};


/* =====================================================
 MARK: - API Repository
 ===================================================== */

class AdminApiRepository {

  constructor(
    apiUrl
  ) {

    this.apiUrl =
      apiUrl;
  }


  async request(
    payload
  ) {

    const response =
      await fetch(
        this.apiUrl,
        {
          method: 'POST',

          body:
            JSON.stringify(
              payload
            )
        }
      );


    if (!response.ok) {

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.error ||
        'Request failed'
      );

    }


    /*
     Compatible with both:

     {
       success: true,
       data: {...}
     }

     and the current nested admin response:

     {
       success: true,
       data: {
         success: true,
         data: {...}
       }
     }
    */

    let data =
      result.data;


    if (
      data &&
      typeof data === 'object' &&
      data.success === false
    ) {

      throw new Error(
        data.error ||
        'Admin request failed'
      );

    }


    if (
      data &&
      typeof data === 'object' &&
      data.success === true &&
      Object.prototype.hasOwnProperty.call(
        data,
        'data'
      )
    ) {

      data =
        data.data;

    }


    return data;
  }


  login(
    password
  ) {

    return this.request({

      action:
        'admin.login',

      password

    });

  }


  bootstrap(
    token
  ) {

    return this.request({

      action:
        'admin.bootstrap',

      token

    });

  }


  saveProduct(
    token,
    data
  ) {

    return this.request({

      action:
        'admin.products.save',

      token,

      ...data

    });

  }


  archiveProduct(
    token,
    productId
  ) {

    return this.request({

      action:
        'admin.products.archive',

      token,

      productId

    });

  }


  saveCategory(
    token,
    data
  ) {

    return this.request({

      action:
        'admin.categories.save',

      token,

      ...data

    });

  }


  adjustInventory(
    token,
    data
  ) {

    return this.request({

      action:
        'admin.inventory.adjust',

      token,

      ...data

    });

  }


  updateOrderStatus(
    token,
    data
  ) {

    return this.request({

      action:
        'admin.orders.status',

      token,

      ...data

    });

  }


  updatePaymentStatus(
    token,
    data
  ) {

    return this.request({

      action:
        'admin.payments.status',

      token,

      ...data

    });

  }


  updateShipment(
    token,
    data
  ) {

    return this.request({

      action:
        'admin.shipments.update',

      token,

      ...data

    });

  }


  saveSetting(
    token,
    data
  ) {

    return this.request({

      action:
        'admin.settings.save',

      token,

      ...data

    });

  }

}


/* =====================================================
 MARK: - UseCases
 ===================================================== */

class AdminLoginUseCase {

  constructor(
    api
  ) {

    this.api =
      api;
  }


  async execute(
    password
  ) {

    if (
      !password
    ) {

      throw new Error(
        'Password is required'
      );

    }


    const data =
      await this.api.login(
        password
      );


    if (
      !data ||
      !data.token
    ) {

      throw new Error(
        'Login response is invalid'
      );

    }


    localStorage.setItem(
      CONFIG.TOKEN_KEY,
      data.token
    );


    return data;
  }

}


class LoadAdminUseCase {

  constructor(
    api
  ) {

    this.api =
      api;
  }


  execute(
    token
  ) {

    return this.api
      .bootstrap(
        token
      );

  }

}


class SaveProductUseCase {

  constructor(
    api
  ) {

    this.api =
      api;
  }


  execute(
    token,
    data
  ) {

    if (
      !String(
        data.name || ''
      ).trim()
    ) {

      throw new Error(
        'Product name is required'
      );

    }


    if (
      !Number.isFinite(
        Number(data.price)
      ) ||
      Number(data.price) < 0
    ) {

      throw new Error(
        'Invalid price'
      );

    }


    return this.api
      .saveProduct(
        token,
        data
      );

  }

}


class SaveCategoryUseCase {

  constructor(
    api
  ) {

    this.api =
      api;
  }


  execute(
    token,
    data
  ) {

    if (
      !String(
        data.name || ''
      ).trim()
    ) {

      throw new Error(
        'Category name is required'
      );

    }


    return this.api
      .saveCategory(
        token,
        data
      );

  }

}


class InventoryAdjustmentUseCase {

  constructor(
    api
  ) {

    this.api =
      api;
  }


  execute(
    token,
    data
  ) {

    if (
      !data.productId
    ) {

      throw new Error(
        'Product ID is required'
      );

    }


    if (
      !Number.isInteger(
        Number(data.delta)
      ) ||
      Number(data.delta) === 0
    ) {

      throw new Error(
        'Inventory delta must be a non-zero integer'
      );

    }


    if (
      !String(
        data.reason || ''
      ).trim()
    ) {

      throw new Error(
        'Reason is required'
      );

    }


    return this.api
      .adjustInventory(
        token,
        data
      );

  }

}

class AdminUI {

  constructor() {

    this.controller =
      null;

    this.data =
      null;

  }


  connect(
    controller
  ) {

    this.controller =
      controller;

  }


  bindEvents() {

    document
      .getElementById(
        'loginButton'
      )
      .addEventListener(
        'click',
        () =>
          this.controller.login()
      );


    document
      .getElementById(
        'loginPassword'
      )
      .addEventListener(
        'keydown',
        event => {

          if (
            event.key ===
            'Enter'
          ) {

            this.controller.login();

          }

        }
      );


    document
      .getElementById(
        'logoutButton'
      )
      .addEventListener(
        'click',
        () =>
          this.controller.logout()
      );


    document
      .getElementById(
        'refreshButton'
      )
      .addEventListener(
        'click',
        () =>
          this.controller.load()
      );


    document
      .querySelectorAll(
        '[data-page]'
      )
      .forEach(
        button => {

          button.addEventListener(
            'click',
            () =>
              this.showPage(
                button.dataset.page
              )
          );

        }
      );


    document
      .getElementById(
        'newProductButton'
      )
      .addEventListener(
        'click',
        () =>
          this.newProduct()
      );


    document
      .getElementById(
        'cancelProductButton'
      )
      .addEventListener(
        'click',
        () =>
          this.closeProductForm()
      );


    document
      .getElementById(
        'saveProductButton'
      )
      .addEventListener(
        'click',
        () =>
          this.controller.saveProduct()
      );


    document
      .getElementById(
        'clearCategoryButton'
      )
      .addEventListener(
        'click',
        () =>
          this.clearCategory()
      );


    document
      .getElementById(
        'saveCategoryButton'
      )
      .addEventListener(
        'click',
        () =>
          this.controller.saveCategory()
      );

  }


  showLogin() {

    document
      .getElementById(
        'loginPage'
      )
      .classList.remove(
        'hidden'
      );


    document
      .getElementById(
        'app'
      )
      .classList.add(
        'hidden'
      );

  }


  hideLogin() {

    document
      .getElementById(
        'loginPage'
      )
      .classList.add(
        'hidden'
      );


    document
      .getElementById(
        'app'
      )
      .classList.remove(
        'hidden'
      );

  }


  showLoginError(
    message
  ) {

    const element =
      document
        .getElementById(
          'loginError'
        );


    element.textContent =
      message;


    element.classList.remove(
      'hidden'
    );

  }


  clearLoginError() {

    document
      .getElementById(
        'loginError'
      )
      .classList.add(
        'hidden'
      );

  }


  showGlobalMessage(
    message,
    success = false
  ) {

    const element =
      document
        .getElementById(
          'globalMessage'
        );


    if (
      !message
    ) {

      element.className =
        'hidden';

      element.textContent =
        '';

      return;

    }


    element.className =
      success
        ? 'message message-success'
        : 'message message-error';


    element.textContent =
      message;

  }


  showPage(
    page
  ) {

    document
      .querySelectorAll(
        '.page'
      )
      .forEach(
        element =>
          element.classList.remove(
            'active'
          )
      );


    const target =
      document
        .getElementById(
          `page-${page}`
        );


    if (target) {

      target.classList.add(
        'active'
      );

    }


    document
      .querySelectorAll(
        '[data-page]'
      )
      .forEach(
        button =>
          button.classList.toggle(
            'active',
            button.dataset.page ===
              page
          )
      );


    const titles = {

      dashboard:
        'Dashboard',

      products:
        'Products',

      categories:
        'Categories',

      inventory:
        'Inventory',

      orders:
        'Orders',

      customers:
        'Customers',

      settings:
        'Settings'

    };


    document
      .getElementById(
        'pageTitle'
      )
      .textContent =
      titles[page] ||
      page;

  }

    this.data =

/* =====================================================
 MARK: - Controller
 ===================================================== */

class AdminController {

  constructor(
    api,
    loginUseCase,
    loadUseCase,
    saveProductUseCase,
    saveCategoryUseCase,
    inventoryUseCase,
    ui
  ) {

    this.api =
      api;

    this.loginUseCase =
      loginUseCase;

    this.loadUseCase =
      loadUseCase;

    this.saveProductUseCase =
      saveProductUseCase;

    this.saveCategoryUseCase =
      saveCategoryUseCase;

    this.inventoryUseCase =
      inventoryUseCase;

    this.ui =
      ui;

  }


  get token() {

    return localStorage.getItem(
      CONFIG.TOKEN_KEY
    );

  }


  async login() {

    const password =
      document
        .getElementById(
          'loginPassword'
        )
        .value;


    this.ui.clearLoginError();


    try {

      await this.loginUseCase
        .execute(
          password
        );


      this.ui.hideLogin();


      await this.load();


    } catch (error) {

      this.ui.showLoginError(
        error.message
      );

    }

  }


  logout() {

    localStorage.removeItem(
      CONFIG.TOKEN_KEY
    );


    this.ui.showLogin();

  }


  async load() {

    const token =
      this.token;


    if (!token) {

      this.ui.showLogin();

      return;

    }


    try {

      const data =
        await this.loadUseCase
          .execute(
            token
          );


      this.ui.render(
        data
      );


    } catch (error) {

      const message =
        String(
          error.message || ''
        );


      if (
        message.includes(
          'expired'
        ) ||
        message.includes(
          'authentication'
        )
      ) {

        this.logout();

        return;

      }


      this.ui.showGlobalMessage(
        message
      );

    }

  }

function formatCurrency(
  value
) {

  return Number(
    value || 0
  )
    .toLocaleString(
      'vi-VN'
    ) + ' ₫';

}


function formatDate(
  value
) {

  if (!value) {
    return '';
  }


  const date =
    new Date(value);


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return '';

  }


  return date.toLocaleString(
    'vi-VN'
  );

}


function escapeHtml(
  value
) {

  return String(
    value ?? ''
  )
    .replaceAll(
      '&',
      '&amp;'
    )
    .replaceAll(
      '<',
      '&lt;'
    )
    .replaceAll(
      '>',
      '&gt;'
    )
    .replaceAll(
      '"',
      '&quot;'
    )
    .replaceAll(
      "'",
      '&#039;'
    );

}


function escapeJs(
  value
) {

  return String(
    value ?? ''
  )
    .replaceAll(
      '\\',
      '\\\\'
    )
    .replaceAll(
      "'",
      "\\'"
    );

}


function createSimpleTable(
  headers,
  rows
) {

  if (
    !rows.length
  ) {

    return `
      <div style="padding:24px">
        No data
      </div>
    `;

  }


  return `

    <table>

      <thead>

        <tr>

          ${headers
            .map(
              header =>
                `
                <th>
                  ${escapeHtml(
                    header
                  )}
                </th>
                `
            )
            .join('')}

        </tr>

      </thead>


      <tbody>

        ${rows
          .map(
            row => `

              <tr>

                ${row
                  .map(
                    value =>
                      `
                      <td>
                        ${escapeHtml(
                          value
                        )}
                      </td>
                      `
                  )
                  .join('')}

              </tr>

            `
          )
          .join('')}

      </tbody>

    </table>

  `;

}
